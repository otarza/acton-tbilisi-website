# PHOTO REGISTER — every photo used on the site must be listed here.
# Files live in src/assets/photos/. Components refer to photos by `id`.
#
# consent:
#   signed      = written parental consent is on file for every identifiable child (Georgian law №3144)
#   pending     = consent not yet confirmed → `npm run check` warns, production must not ship these
#   none-needed = no identifiable children (backs of heads, hands, objects, adults who agreed)
#
# Source of the current photos: cropped from the school's public Facebook posts (2026-11).
# Consent: every enrolled family signs the school contract, which includes written consent to public use
# of photos (confirmed by Otar, 2026-11-21). Photos of enrolled children → consent: signed.
# Children who are NOT enrolled (visitors, siblings, trial-week children) still need their own consent.
