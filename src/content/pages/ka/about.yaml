# ABOUT PAGE COPY (Georgian). Team members with bios live in src/content/team/ka/.
seo:
  title: ჩვენ შესახებ · ექტონის აკადემია საბურთალო
  description: ვინ შექმნა სკოლა, ვინ მუშაობს ბავშვებთან, აკრედიტაცია, უსაფრთხოება და ფოტოების წესი.

hero:
  label: ჩვენ შესახებ
  title: სკოლა, რომელიც
  accent: მშობლებმა შექმნეს
  after: საკუთარი შვილებისთვის.
  lead: "2025 წელს რამდენიმე ოჯახმა გადაწყვიტა, რომ არ დალოდებოდა, როდის შეიცვლებოდა სკოლა. ავაშენეთ ის, რაც ჩვენს ბავშვებს გვინდოდა: ადგილი, სადაც კითხვა უფრო მნიშვნელოვანია, ვიდრე ზეპირად დასწავლილი პასუხი."
  placeholder: true   # stats need confirmation
  stats:
    - big: "30"
      text: "დამფუძნებელი, მათ შორის 13 სკოლის მშობელი"
    - big: "300+"
      text: "სკოლა Acton-ის ქსელში"
    - big: "1:10"
      text: "მეგზური და ბავშვები, მაქსიმუმ"
    - big: "2025"
      text: "IALDS-ის აკრედიტაცია"

story:
  label: ჩვენი ისტორია
  title: როგორ
  accent: დაიწყო
  placeholder: true   # dates and story details need confirmation
  items:
    - when: "2024, შემოდგომა"
      title: "რამდენიმე ოჯახი, ერთი კითხვა"
      text: "მშობლები ვსვამდით კითხვას: რატომ ბეზრდებათ ბავშვებს სკოლა, თუ სწავლა ასე საინტერესოა? ვიპოვეთ Acton-ის მოდელი და ვესტუმრეთ რამდენიმე სკოლას ევროპაში."
    - when: "2025, გაზაფხული"
      title: "დამფუძნებლები"
      text: "30 დამფუძნებელმა, მათ შორის სკოლის მომავალმა მშობლებმა, დააფინანსა პირველი სტუდია საბურთალოზე."
    - when: "2025, ზაფხული"
      title: "IALDS-ის აკრედიტაცია"
      text: "მეგზურებმა გაიარეს Acton-ის მომზადება, სკოლამ კი მიიღო საერთაშორისო ასოციაციის აკრედიტაცია."
    - when: "2025, 15 სექტემბერი"
      title: "პირველი დღე"
      text: "ბავშვებმა პირველივე კვირაში თავად დაწერეს სტუდიის წესები და ხელი მოაწერეს. ის ფურცელი დღემდე კედელზე კიდია."

team:
  label: გუნდი
  title: ადამიანები,
  accent: ვისაც შვილს ანდობთ
  bioNote: ნიმუშის ტექსტი · საბოლოო ბიოგრაფიას თავად ადამიანი დაადასტურებს
  groups:
    guide:
      label: "მეგზურები"
      intro: "მეგზური არ ასწავლის ლექციით. ის სვამს კითხვებს, იცავს წესებს და ეხმარება ბავშვს, თავად იპოვოს პასუხი. ყველამ გაიარა Acton-ის მომზადება და ნასამართლობის შემოწმება."
    admin:
      label: "ადმინისტრაცია"
      intro: "ადამიანები, ვინც სკოლის ყოველდღიურ მართვაზე ზრუნავენ."

