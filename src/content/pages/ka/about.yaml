accreditation:
  label: აკრედიტაცია და სტატუსი
  title: რა ვიცით და
  accent: რას ვამოწმებთ ჯერ კიდევ
  cards:
    - status: confirmed
      statusLabel: დადასტურებულია
      title: IALDS
      text: International Association of Learner Driven Schools. აკრედიტაცია მივიღეთ 2025 წელს. ასოციაცია აერთიანებს 300-ზე მეტ სკოლას 24 ქვეყანაში, 5 კონტინენტზე.
      link:   # TODO: add the certificate PDF to public/docs/
        text: "სერტიფიკატის ნახვა (PDF) →"
        href: "#"
    - status: confirmed
      statusLabel: დადასტურებულია
      title: სახელმწიფო ავტორიზაცია (განათლების ხარისხის განვითარების ეროვნული ცენტრი)
      text: "სკოლა ავტორიზებულია: განათლების ხარისხის განვითარების ეროვნულმა ცენტრმა (EQE) ჩვენს პროგრამაზე დადებითი დასკვნა გასცა. სკოლა სტანდარტულ სახელმწიფო ატესტატს გასცემს, რომელიც მისაღებია როგორც ქართული, ისე უცხოური უნივერსიტეტებისთვის. სხვა სკოლაში გადასვლა (მობილობა) სტანდარტული წესით ხდება."
    - status: info
      statusLabel: როგორ ვზომავთ
      title: ყოველწლიური შეფასება
      text: წელიწადში ერთხელ ბავშვები წერენ სტანდარტიზებულ ტესტს (მათემატიკა, კითხვა, ინგლისური), რომ მშობლებმა ნახონ, სად დგანან სხვა ქართველ თანატოლებთან შედარებით.

safety:
  label: უსაფრთხოება
  title: თავისუფლება
  accent: საიმედო ჩარჩოში
  intro: "ბავშვები ბევრ რამეს თავად წყვეტენ. ზოგ რამეს კი არასდროს: უსაფრთხოების წესები უფროსებისაა."
  placeholder: true   # every safety claim must be checked by the school before launch
  items:
    - icon: "👥"
      title: "მაქსიმუმ 10 ბავშვი ერთ მეგზურზე"
      text: "უმცროს სტუდიაში 8. სტუდიაში ყოველთვის არის ორი ზრდასრული."
    - icon: "🔒"
      title: "დაცული შესასვლელი"
      text: "შენობაში შესვლა მხოლოდ ბარათით. ბავშვს გაატანთ მხოლოდ იმ ადამიანებს, ვინც სიაში გყავთ."
    - icon: "🩹"
      title: "პირველი დახმარება"
      text: "ყველა მეგზურს აქვს სერტიფიკატი. ექიმი ახლოს არის, ალერგიის სია სამზარეულოშია."
    - icon: "🧾"
      title: "ნასამართლობის შემოწმება"
      text: "ყველა თანამშრომელი და მოხალისე, ვინც ბავშვებთან მუშაობს."
    - icon: "🤝"
      title: "ბულინგზე ნულოვანი შემწყნარებლობა"
      text: "ბავშვები თავად წერენ ქცევის წესებს და თავად არჩევენ კონფლიქტებს მეგზურის დახმარებით. სერიოზულ შემთხვევას მშობელს იმავე დღეს ვატყობინებთ."
    - icon: "📵"
      title: "ტელეფონი ჩანთაში"
      text: "სკოლის დროს ბავშვების ტელეფონები გამორთულია. ეკრანი მხოლოდ სწავლისთვის, შეზღუდული დროით."

privacy:
  label: ფოტოები და მონაცემები
  title: თქვენი შვილის სახე
  accent: თქვენი გადასაწყვეტია
  intro: ჩვენს საიტზე და სოციალურ ქსელებში ყველა ფოტო ნამდვილია და გამოქვეყნებულია მხოლოდ მშობლის წერილობითი თანხმობით, „პერსონალურ მონაცემთა დაცვის შესახებ“ საქართველოს კანონის (№3144) შესაბამისად.
  details:
    - q: "რა მონაცემებს ვაგროვებთ"
      a: "სახელი, ასაკი, მშობლის კონტაქტი, ჯანმრთელობის ის ინფორმაცია, რაც უსაფრთხოებისთვის გვჭირდება (ალერგია, მედიკამენტები), და სწავლის პორტფოლიო. სხვა არაფერი."
    - q: "ვინ ხედავს მათ"
      a: "მხოლოდ ბავშვის მეგზური და სკოლის ადმინისტრაცია. მესამე მხარეს არ გადავცემთ და არ ვყიდით."
    - q: "რამდენ ხანს ვინახავთ"
      a: "სკოლაში ყოფნის განმავლობაში და მის შემდეგ 1 წელი. მოთხოვნისთანავე წავშლით."
    - q: "საიტის ასისტენტი და თქვენი კითხვები"
      a: "საიტის ასისტენტი პასუხობს მხოლოდ სკოლის მიერ დამტკიცებული კითხვა-პასუხებით და არ ინახავს თქვენს სახელს. ნებისმიერ დროს შეგიძლიათ მისწეროთ ადამიანს."
    - q: "საიტის ფორმები"
      a: "შეხვედრის ფორმაში ვითხოვთ მხოლოდ მშობლის სახელს, ტელეფონს და ბავშვის ასაკს, კლუბში ჩაწერისას კი ასევე არჩეულ კლუბებს და იმას, ჩვენს სკოლაში სწავლობს თუ სხვაგან. ეს ინფორმაცია ინახება სკოლის დახურულ ცხრილში და გამოიყენება მხოლოდ თქვენთან დასაკავშირებლად."
    - q: "საჩივარი და კონტროლი"
      a: "მონაცემთა დაცვაზე ზედამხედველობას ახორციელებს სახელმწიფო აუდიტის სამსახური (2026 წლის მარტიდან). ჩვენი კონტაქტი: info@americanschool.ge."
  consentDemo:
    title: თანხმობის ფორმის ნიმუში
    intro: ასე გამოიყურება ის, რასაც ჩარიცხვისას ავსებთ. შეგიძლიათ ნებისმიერ დროს შეცვალოთ.
    noneText: თქვენი შვილის ფოტო არსად გამოქვეყნდება. ეს სრულიად ნორმალურია.
    someText: "ჩართულია {n} / {total}. შეგიძლიათ ნებისმიერ დროს შეცვალოთ ერთი წერილით."
    switches:
      - label: "ფოტო სკოლის საიტზე"
        hint: "სახე ჩანს, სახელი არასდროს"
        on: true
      - label: "ფოტო Facebook-სა და Instagram-ზე"
        hint: "მხოლოდ სკოლის ოფიციალურ გვერდებზე"
        on: false
      - label: "ჯგუფური ფოტო მშობლების ჩატში"
        hint: "დახურული ჯგუფი, მხოლოდ ჩვენი ოჯახები"
        on: true
      - label: "კვირის წერილი ელფოსტით"
        hint: "რა გააკეთეს ბავშვებმა ამ კვირას"
        on: true

cta:
  title: გაიცანით გუნდი პირადად.
  accent: "დაახლოებით 1 საათი, არანაირი ვალდებულება."
  button: დაჯავშნე შეხვედრა
