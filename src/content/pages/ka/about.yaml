# ABOUT PAGE COPY (Georgian). Team members with bios live in src/content/team/ka/.
seo:
  title: ჩვენ შესახებ · ექტონის აკადემია საბურთალო
  description: ვინ შექმნა სკოლა, ვინ მუშაობს ბავშვებთან, აკრედიტაცია, უსაფრთხოება და ფოტოების წესი.

hero:
  label: ჩვენ შესახებ
  title: სკოლა, რომელიც
  accent: მშობლებმა შექმნეს
  after: საკუთარი შვილებისთვის.
  lead: "2025 წელს რამდენიმე ოჯახმა გადაწყვიტა, რომ არ დალოდებოდა, როდის შეიცვლებოდა სკოლა. ავაშენეთ ის, რაც ჩვენს ბავშვებს გვინდოდა: ადგილი, სადაც კითხვა უფრო მნიშვნელოვანია, ვიდრე ზეპირად დასწავლილი პასუხი."
  placeholder: true   # stats need confirmation
  stats:
    - big: "30"
      text: "ადამიანი გუნდში და მხარდამჭერებს შორის"
    - big: "300+"
      text: "სკოლა Acton-ის ქსელში"
    - big: "1:10"
      text: "მეგზური და ბავშვები, მაქსიმუმ"
    - big: "2025"
      text: "IALDS-ის აკრედიტაცია"

story:
  label: ჩვენი ისტორია
  title: როგორ
  accent: დაიწყო
  placeholder: true   # dates and story details need confirmation
  items:
    - when: "2024, შემოდგომა"
      title: "რამდენიმე ოჯახი, ერთი კითხვა"
      text: "მშობლები ვსვამდით კითხვას: რატომ ბეზრდებათ ბავშვებს სკოლა, თუ სწავლა ასე საინტერესოა? ვიპოვეთ Acton-ის მოდელი და ვესტუმრეთ რამდენიმე სკოლას ევროპაში."
    - when: "2025, გაზაფხული"
      title: "დამფუძნებლები და ინვესტორები"
      text: "5 დამფუძნებელმა და 21 ინვესტორმა, მათ შორის სკოლის მომავალმა მშობლებმა, დააფინანსეს პირველი სტუდია საბურთალოზე."
    - when: "2025, ზაფხული"
      title: "IALDS-ის აკრედიტაცია"
      text: "მეგზურებმა გაიარეს Acton-ის მომზადება, სკოლამ კი მიიღო საერთაშორისო ასოციაციის აკრედიტაცია."
    - when: "2025, 15 სექტემბერი"
      title: "პირველი დღე"
      text: "ბავშვებმა პირველივე კვირაში თავად დაწერეს სტუდიის წესები და ხელი მოაწერეს. ის ფურცელი დღემდე კედელზე კიდია."

team:
  label: გუნდი
  title: ადამიანები,
  accent: ვისაც შვილს ანდობთ
  bioNote: ნიმუშის ტექსტი · საბოლოო ბიოგრაფიას თავად ადამიანი დაადასტურებს
  groups:
    founder:
      label: "დამფუძნებლები"
      intro: "ხუთი ადამიანი, რომლებმაც სკოლის იდეა რეალობად აქციეს. ზოგი მათგანი თავად არის მშობელი."
    guide:
      label: "მეგზურები"
      intro: "მეგზური არ ასწავლის ლექციით. ის სვამს კითხვებს, იცავს წესებს და ეხმარება ბავშვს, თავად იპოვოს პასუხი. ყველამ გაიარა Acton-ის მომზადება და ნასამართლობის შემოწმება."
    investor:
      label: "ინვესტორები"
      intro: "სკოლა დააფინანსეს ადამიანებმა, ვისაც სჯერა, რომ თბილისს ასეთი სკოლა სჭირდება. ოთხი მათგანი სკოლის მშობელიც არის."
  investors:
    - name: "რეზი ზაკალაშვილი"
    - name: "ლევან ხიმშიაშვილი"
    - name: "ირაკლი ჭრელაშვილი"
    - name: "მაქს ჭანია"
    - name: "ნიკა ციცქიშვილი"
    - name: "დავით ცერცვაძე"
    - name: "ათუკა შავიშვილი"
    - name: "ნოდარ ჩინჩალაძე"
    - name: "ნუგზარ ქსოვრელი"
      isParent: true
    - name: "ალექსანდრე ქსოვრელი"
    - name: "ლევან აგლაძე"
    - name: "მარი ფურცხვანიძე"
    - name: "დავით ფანჯაკიძე"
    - name: "თემურ უგულავა"
    - name: "თათუკა ნარტყოშვილი"
      isParent: true
    - name: "ოთარ ზაკალაშვილი"
      isParent: true
    - name: "გიორგი დვალი"
    - name: "გიორგი გვენეტაძე"
    - name: "ზურა ბუხნიკაშვილი"
    - name: "გიორგი ახობაძე"
    - name: "ლაშა ადიკაშვილი"
      isParent: true

accreditation:
  label: აკრედიტაცია და სტატუსი
  title: რა ვიცით და
  accent: რას ვამოწმებთ ჯერ კიდევ
  cards:
    - status: confirmed
      statusLabel: დადასტურებულია
      title: IALDS
      text: International Association of Learner Driven Schools. აკრედიტაცია მივიღეთ 2025 წელს. ასოციაცია აერთიანებს 300-ზე მეტ სკოლას 24 ქვეყანაში, 5 კონტინენტზე.
      link:   # TODO: add the certificate PDF to public/docs/
        text: "სერტიფიკატის ნახვა (PDF) →"
        href: "#"
    - status: pending
      statusLabel: დასაზუსტებელია
      title: სახელმწიფო ავტორიზაცია (განათლების ხარისხის განვითარების ეროვნული ცენტრი)
      text: "[დასაზუსტებელია] აქ ზუსტად დავწერთ ჩვენს სტატუსს: გვაქვს თუ არა ავტორიზაცია, როგორ ხდება ატესტატის მიღება და გადასვლა სხვა სკოლაში. მშობლები ამას პირველივე ზარზე გვეკითხებიან, ამიტომ პასუხი აქ უნდა იყოს."
    - status: info
      statusLabel: როგორ ვზომავთ
      title: ყოველწლიური შეფასება
      text: წელიწადში ერთხელ ბავშვები წერენ სტანდარტიზებულ ტესტს (მათემატიკა, კითხვა, ინგლისური), რომ მშობლებმა ნახონ, სად დგანან სხვა ქართველ თანატოლებთან შედარებით.

safety:
  label: უსაფრთხოება
  title: თავისუფლება
  accent: საიმედო ჩარჩოში
  intro: "ბავშვები ბევრ რამეს თავად წყვეტენ. ზოგ რამეს კი არასდროს: უსაფრთხოების წესები უფროსებისაა."
  placeholder: true   # every safety claim must be checked by the school before launch
  items:
    - icon: "👥"
      title: "მაქსიმუმ 10 ბავშვი ერთ მეგზურზე"
      text: "უმცროს სტუდიაში 8. სტუდიაში ყოველთვის არის ორი ზრდასრული."
    - icon: "🔒"
      title: "დაცული შესასვლელი"
      text: "შენობაში შესვლა მხოლოდ ბარათით. ბავშვს გაატანთ მხოლოდ იმ ადამიანებს, ვინც სიაში გყავთ."
    - icon: "🩹"
      title: "პირველი დახმარება"
      text: "ყველა მეგზურს აქვს სერტიფიკატი. ექიმი ახლოს არის, ალერგიის სია სამზარეულოშია."
    - icon: "🧾"
      title: "ნასამართლობის შემოწმება"
      text: "ყველა თანამშრომელი და მოხალისე, ვინც ბავშვებთან მუშაობს."
    - icon: "🤝"
      title: "ბულინგზე ნულოვანი შემწყნარებლობა"
      text: "ბავშვები თავად წერენ ქცევის წესებს და თავად არჩევენ კონფლიქტებს მეგზურის დახმარებით. სერიოზულ შემთხვევას მშობელს იმავე დღეს ვატყობინებთ."
    - icon: "📵"
      title: "ტელეფონი ჩანთაში"
      text: "სკოლის დროს ბავშვების ტელეფონები გამორთულია. ეკრანი მხოლოდ სწავლისთვის, შეზღუდული დროით."

privacy:
  label: ფოტოები და მონაცემები
  title: თქვენი შვილის სახე
  accent: თქვენი გადასაწყვეტია
  intro: ჩვენს საიტზე და სოციალურ ქსელებში ყველა ფოტო ნამდვილია და გამოქვეყნებულია მხოლოდ მშობლის წერილობითი თანხმობით, „პერსონალურ მონაცემთა დაცვის შესახებ“ საქართველოს კანონის (№3144) შესაბამისად.
  details:
    - q: "რა მონაცემებს ვაგროვებთ"
      a: "სახელი, ასაკი, მშობლის კონტაქტი, ჯანმრთელობის ის ინფორმაცია, რაც უსაფრთხოებისთვის გვჭირდება (ალერგია, მედიკამენტები), და სწავლის პორტფოლიო. სხვა არაფერი."
    - q: "ვინ ხედავს მათ"
      a: "მხოლოდ ბავშვის მეგზური და სკოლის ადმინისტრაცია. მესამე მხარეს არ გადავცემთ და არ ვყიდით."
    - q: "რამდენ ხანს ვინახავთ"
      a: "სკოლაში ყოფნის განმავლობაში და მის შემდეგ 1 წელი. მოთხოვნისთანავე წავშლით."
    - q: "საიტის ასისტენტი და თქვენი კითხვები"
      a: "საიტის ასისტენტი პასუხობს მხოლოდ სკოლის მიერ დამტკიცებული კითხვა-პასუხებით და არ ინახავს თქვენს სახელს. ნებისმიერ დროს შეგიძლიათ მისწეროთ ადამიანს."
    - q: "საიტის ფორმები"
      a: "შეხვედრის ფორმაში ვითხოვთ მხოლოდ მშობლის სახელს, ტელეფონს და ბავშვის ასაკს. ეს ინფორმაცია ინახება სკოლის დახურულ ცხრილში და გამოიყენება მხოლოდ თქვენთან დასაკავშირებლად."
    - q: "საჩივარი და კონტროლი"
      a: "მონაცემთა დაცვაზე ზედამხედველობას ახორციელებს სახელმწიფო აუდიტის სამსახური (2026 წლის მარტიდან). ჩვენი კონტაქტი: info@americanschool.ge."
  consentDemo:
    title: თანხმობის ფორმის ნიმუში
    intro: ასე გამოიყურება ის, რასაც ჩარიცხვისას ავსებთ. შეგიძლიათ ნებისმიერ დროს შეცვალოთ.
    noneText: თქვენი შვილის ფოტო არსად გამოქვეყნდება. ეს სრულიად ნორმალურია.
    someText: "ჩართულია {n} / {total}. შეგიძლიათ ნებისმიერ დროს შეცვალოთ ერთი წერილით."
    switches:
      - label: "ფოტო სკოლის საიტზე"
        hint: "სახე ჩანს, სახელი არასდროს"
        on: true
      - label: "ფოტო Facebook-სა და Instagram-ზე"
        hint: "მხოლოდ სკოლის ოფიციალურ გვერდებზე"
        on: false
      - label: "ჯგუფური ფოტო მშობლების ჩატში"
        hint: "დახურული ჯგუფი, მხოლოდ ჩვენი ოჯახები"
        on: true
      - label: "კვირის წერილი ელფოსტით"
        hint: "რა გააკეთეს ბავშვებმა ამ კვირას"
        on: true

cta:
  title: გაიცანით გუნდი პირადად.
  accent: 30 წუთი, არანაირი ვალდებულება.
  button: დაჯავშნე შეხვედრა
