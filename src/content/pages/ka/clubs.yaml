# CLUBS PAGE COPY (Georgian): /clubs and every /clubs/<club> page.
# The clubs themselves live in src/content/clubs/ka/ (one file each). Confirmed club FAQ answers live in
# src/content/faq/ka/ with `category: clubs` (the assistant answers from those too).
# Confirmed by Otar (2026-11-24): 10 clubs, ages 5–17, other schools welcome, twice a week on weekdays,
# 16:00–18:00, 150 GEL per club per month, phone 500 50 36 05.
seo:
  title: "კლუბები სკოლის შემდეგ · ექტონის აკადემია საბურთალო"
  description: "10 სკოლისშემდგომი კლუბი 5–17 წლის ბავშვებისთვის: ბიზნესი, რობოტიკა, ხელოვნება, AI და სხვა. კვირაში 2-ჯერ, 16:00–18:00, 150 ₾ თვეში. სხვა სკოლის ბავშვებიც."

facts:
  ages: "5–17"
  agesText: "5–17 წელი"
  ageMin: 5
  ageMax: 17
  frequency: "კვირაში 2-ჯერ"
  time: "16:00–18:00"
  price: 150
  currency: "₾"
  perMonth: "/ თვე"
  phone: "500 50 36 05"
  phoneHref: "tel:+995500503605"
  audience: "ჩვენი და სხვა სკოლის ბავშვები"

