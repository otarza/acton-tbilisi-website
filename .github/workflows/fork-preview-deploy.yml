# Preview deployments for pull requests from forks, step 2 of 2: upload.
#
# Runs from main (never from the fork's copy of this file), so a fork cannot change what it
# does. It runs no code from the fork: it only uploads the files the build step produced to
# Cloudflare Pages as a preview, then comments the link on the pull request.
#
# Needs the repository secret CLOUDFLARE_API_TOKEN (Account → Cloudflare Pages: Edit) and the
# repository variable CLOUDFLARE_ACCOUNT_ID. See docs/DEPLOY.md.
name: Fork preview (deploy)

on:
  workflow_run:
    workflows: ['Fork preview (build)']
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: fork-preview
          path: pr
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Check the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          number="$(tr -dc '0-9' < pr/pr-number)"
          [ -n "$number" ] || { echo "No PR number in the artifact"; exit 1; }
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" --jq .head.sha)"
          if [ "$head_sha" != "$RUN_HEAD_SHA" ]; then
            echo "PR #${number} head ($head_sha) does not match the built commit ($RUN_HEAD_SHA); skipping."
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Use the PR's Pages Functions so the preview matches the PR. Wrangler only bundles them.
          rm -rf functions && cp -r pr/functions functions
          npx wrangler pages deploy pr/dist \
            --project-name=acton-tbilisi-website \
            --branch="pr-${{ steps.pr.outputs.number }}" \
            --commit-hash="${{ steps.pr.outputs.sha }}" \
            --commit-dirty=true

      - name: Comment the preview link
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_SHA: ${{ steps.pr.outputs.sha }}
        with:
          script: |
            const number = Number(process.env.PR_NUMBER);
            const url = `https://pr-${number}.acton-tbilisi-website.pages.dev`;
            const marker = '<!-- fork-preview -->';
            const body = `${marker}\n**Preview:** ${url}\n\nBuilt from ${process.env.PR_SHA.slice(0, 7)}. Updates on every push to this pull request.`;
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number });
            const mine = comments.find((c) => c.body && c.body.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
