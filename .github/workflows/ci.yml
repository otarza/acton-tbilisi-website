name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type and content checks
        run: npm run check
      - name: Build
        run: npm run build
      - name: Placeholder report
        if: github.event_name == 'pull_request'
        run: npm run placeholders | tee -a "$GITHUB_STEP_SUMMARY"
